<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>Avatar circular · reserva</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@800&family=Inter:wght@400;600&display=swap" rel="stylesheet">
<!--
  AVATAR CIRCULAR DE RESERVA
  ==========================
  Este archivo guarda el avatar con forma de círculo que se deforma (el que había antes
  de la aurícula). Se puede abrir tal cual en el navegador para verlo funcionando.

  Para volver a ponerlo en index.html:
    1. En assets/css/style.css, sustituye el bloque "/* atrium-shaped avatar */" por el
       bloque marcado como "CSS DEL AVATAR CIRCULAR" de abajo.
    2. Sustituye el <div class="avatar">…</div> de la portada por el bloque "HTML DEL AVATAR CIRCULAR".
    3. En la parte responsive (@media max-width:860px) de assets/css/style.css, cambia las líneas de .avatar
       por la línea indicada en "RESPONSIVE".
  (O simplemente pídeselo a Claude: "vuelve a poner el avatar circular".)
-->
<style>
/* variables mínimas para que esta página de muestra funcione sola (en index.html ya existen) */
:root{--turq:#7fd8cf;--turq-d:#3fb3a7;--lila:#c7b5f0;--bg:#fbfaff;--grad:linear-gradient(120deg,var(--turq),var(--lila))}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);font-family:Inter,sans-serif}

/* ===== CSS DEL AVATAR CIRCULAR ===== */
.avatar{position:relative;width:min(340px,80vw);aspect-ratio:1;margin:auto}
.avatar .ring{position:absolute;inset:0;border-radius:42% 58% 63% 37%/45% 40% 60% 55%;background:var(--grad);animation:morph 10s ease-in-out infinite}
.avatar .in{position:absolute;inset:14px;border-radius:42% 58% 63% 37%/45% 40% 60% 55%;background:var(--bg);display:grid;place-items:center;animation:morph 10s ease-in-out infinite}
.avatar .ini{font-family:Outfit;font-weight:800;font-size:5rem;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.avatar .in img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;border-radius:inherit}
@keyframes morph{0%,100%{border-radius:42% 58% 63% 37%/45% 40% 60% 55%}50%{border-radius:58% 42% 35% 65%/55% 62% 38% 45%}}
.ecg{position:absolute;left:-10%;bottom:12%;width:120%;height:70px}
.ecg path{fill:none;stroke:var(--turq-d);stroke-width:3;stroke-linecap:round;stroke-dasharray:900;stroke-dashoffset:900;animation:draw 3.5s ease-in-out infinite}
@keyframes draw{0%{stroke-dashoffset:900}60%,100%{stroke-dashoffset:0;opacity:1}}
/* ===== FIN CSS ===== */

/* ===== RESPONSIVE (dentro de @media (max-width:860px) en assets/css/style.css) =====
  .avatar{width:220px;order:-1}
*/
</style>
</head>
<body>

<!-- ===== HTML DEL AVATAR CIRCULAR ===== -->
<div class="avatar">
  <div class="ring"></div>
  <div class="in"><span class="ini">HH</span><img src="../assets/foto-perfil.jpg" alt="Hugo Hernández" onerror="this.remove()"></div>
  <svg class="ecg" viewBox="0 0 600 70" preserveAspectRatio="none"><path d="M0 40 H170 L190 40 L205 12 L222 64 L240 4 L258 52 L272 40 H380 L395 30 L410 40 H600"/></svg>
</div>
<!-- ===== FIN HTML (en index.html la ruta de la foto es "assets/foto-perfil.jpg", sin "../") ===== -->

</body>
</html>
